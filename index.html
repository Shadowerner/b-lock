var adPlugin=null,adReady=false,adLoading=false;
function initAd(){
  if(adPlugin)return adPlugin;
  if(!window.Capacitor||!Capacitor.Plugins||!Capacitor.Plugins.AdMob)return null;
  adPlugin=Capacitor.Plugins.AdMob;
  return adPlugin;
}
async function prepareAd(){
  var p=initAd();
  if(!p){$('adStatus').textContent='Publicité disponible uniquement dans l’application Android.';return false}
  if(adReady)return true;
  if(adLoading)return false;
  adLoading=true;
  try{
    await p.initialize();
    await p.prepareRewardVideoAd({adId:'ca-app-pub-4074481395259436/7358677773'});
    adReady=true;
    $('adStatus').textContent='Publicité prête.';
    return true;
  }catch(e){
    adReady=false;
    $('adStatus').textContent='Publicité indisponible pour le moment.';
    return false;
  }finally{adLoading=false}
}
$('supportAd').onclick=async function(){
  var p=initAd();
  if(!p){$('adStatus').textContent='Publicité disponible uniquement dans l’application Android.';return}
  $('supportAd').disabled=true;

    if(!adReady){var ok=await prepareAd();if(!ok)return}

  }catch(e){
    adReady=false;

};
