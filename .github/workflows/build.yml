name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Activer le cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparer les dossiers
        run: |
          mkdir -p www assets
          cp index.html icon-192.png icon-512.png b-lock-icone.png www/
          cp icon-only.png icon-foreground.png icon-background.png assets/

      - run: npm install --no-audit --no-fund
      - run: npm install @capacitor-community/admob --no-audit --no-fund
      - run: npx cap add android

      - name: Configurer AdMob
        run: |
          sed -i 's|</application>|<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4074481395259436~1176412806"/></application>|' android/app/src/main/AndroidManifest.xml

      - name: Optimiser Gradle
        run: |
          echo "org.gradle.parallel=true" >> android/gradle.properties
          echo "org.gradle.caching=true" >> android/gradle.properties
          echo "org.gradle.configureondemand=true" >> android/gradle.properties

      - run: npx capacitor-assets generate --android
      - run: npx cap sync android

      - name: Compiler l APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache

      - name: Renommer l APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk B-LOCK.apk

      - uses: actions/upload-artifact@v7
        with:
          name: B-LOCK
          path: B-LOCK.apk
          archive: false
